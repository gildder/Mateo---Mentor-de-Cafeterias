[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mateo-crm"
version = "0.1.0"
requires-python = ">=3.12"
description = "Gem-first private coffee-shop mentoring CRM"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2,<3", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2,<3", "psycopg[binary]>=3,<4", "google-api-python-client>=2,<3", "google-auth>=2,<3", "google-auth-oauthlib>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "httpx>=0.27,<1", "ruff>=0.8,<1", "mypy>=1.13,<2"]

[tool.setuptools.packages.find]
include = ["mateo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["mateo/core.py", "mateo/calculators.py", "mateo/contracts.py"]
check_untyped_defs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["mateo"]

[tool.coverage.report]
show_missing = true
